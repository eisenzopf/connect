<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 678" role="img" aria-labelledby="title description">
<title id="title">Private consultation, then an explicit decision</title><desc id="description">The app requests a private audience. Connect retains the organizer leg, prepares private context and media, and observes actual private duplex. The application separately obtains consent and chooses handoff or return under current authority. The media/role outcome must be observed.</desc>
