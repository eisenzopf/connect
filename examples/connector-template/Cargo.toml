[package]
name = "connect-connector-template"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

# Standalone contribution package: no server/store internals or workspace edits.
[workspace]

[dependencies]
connect-connector-api = { path = "../../crates/connect-connector-api" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
