[package]
name = "connect-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
memory-diagnostics = ["test-support", "dep:rvoip-infra-common", "rvoip-infra-common/memory-diagnostics", "rvoip-core/memory-diagnostics", "rvoip-webrtc/memory-diagnostics", "rvoip-uctp/memory-diagnostics", "connect-store/memory-diagnostics"]
test-support = ["connect-store/test-support", "rvoip-core/test-support", "rvoip-uctp/test-support"]

[dependencies]
arc-swap.workspace = true
rvoip-infra-common = { path = "../../.deps/rvoip/crates/foundation/infra-common", optional = true }
connect-protocol.workspace = true
connect-store.workspace = true
rvoip-core.workspace = true
rvoip-webrtc.workspace = true
rvoip-sip.workspace = true
rvoip-sip-dialog.workspace = true
rvoip-sip-core.workspace = true
rvoip-sip-transport.workspace = true
rvoip-uctp.workspace = true
rvoip-auth-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["json"] }
tempfile.workspace = true
ring.workspace = true
base64.workspace = true

[lints]
workspace = true
