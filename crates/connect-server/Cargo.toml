[package]
name = "connect-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
test-support = ["connect-store/test-support", "connect-service/test-support"]

[dependencies]
reqwest.workspace = true
url.workspace = true
connect-connector-api.workspace = true
connect-protocol.workspace = true
connect-store.workspace = true
connect-service.workspace = true
connect-client.workspace = true
connect-connectors.workspace = true
connect-mcp.workspace = true
axum = { workspace = true, features = ["ws"] }
socket2 = "0.6.5"
tower-http.workspace = true
telnyx.workspace = true
rvoip-quic.workspace = true
rvoip-uctp.workspace = true
rvoip-vapi.workspace = true
rvoip-websocket = { workspace = true, features = ["wss"] }
rvoip-webtransport.workspace = true
rvoip-sip.workspace = true
rvoip-webrtc.workspace = true
rvoip-sip-core.workspace = true
rvoip-auth-core.workspace = true
rvoip-core.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
futures-util.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true
rustls.workspace = true
quinn.workspace = true
rcgen.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
chrono.workspace = true
fs2.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
x509-parser.workspace = true
tokio-tungstenite.workspace = true
base64.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
opus = "0.3"
web-transport-quinn = { version = "0.11.12", default-features = false, features = ["ring"] }
rvoip-rtp-core = { path = "../../.deps/rvoip/crates/media/rtp-core", default-features = false }
rvoip-sip-dialog.workspace = true
connect-connector-http.workspace = true
connect-native-video = { path = "../../examples/native-video" }
prism-fixture = { path = "../../examples/connector-contribution" }
connect-connector-template = { path = "../../examples/connector-template" }
connect-media-connector-template = { path = "../../examples/media-connector-template" }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest-mcp = { package = "reqwest", version = "0.13.2", default-features = false, features = ["json", "stream"] }
tempfile.workspace = true
ed25519-dalek = "2"
p256 = { workspace = true, features = ["ecdsa"] }
wiremock = "0.6"
rusqlite.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "=0.26.4", default-features = false, features = ["fs", "net"] }
socket2 = { version = "0.6.5", features = ["all"] }

[lints]
workspace = true

[[bin]]
name = "connect"
path = "src/main.rs"
