[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "connect-sdk"
version = "0.1.0"
description = "Connect SDK with canonical native and explicit HTTP/HTTPS control"
requires-python = ">=3.11"

[tool.setuptools.package-data]
connect_sdk = ["py.typed"]
