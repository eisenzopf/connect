[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "rudeless-connect"
version = "0.1.0"
description = "Connect SDK with canonical native and explicit HTTP/HTTPS control"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/eisenzopf/connect"

[tool.setuptools.package-data]
connect_sdk = ["py.typed"]
