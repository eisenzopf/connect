name: Local source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify host and pinned Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show
      - name: Install native Opus build dependency
        run: |
          brew install opus pkgconf
          pkg-config --modversion opus
          test -f "$(brew --prefix opus)/lib/libopus.a"
      - name: Reserve diagnostic headroom and record host storage
        run: python3 scripts/ci-diagnostics.py prepare
      - name: Run source qualification (no accounts or live calls)
        run: python3 scripts/check-local.py --ci
      - name: Verify generated TypeScript distribution
        run: git diff --exit-code -- sdk/typescript/dist

      - name: Retain actual phase and disk diagnostics
        if: always()
        run: python3 scripts/ci-diagnostics.py collect
      - name: Upload source-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-arm64-source-diagnostics-${{ github.run_attempt }}
          path: .local/ci-diagnostics/upload/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  gate-3-recovery:
    # The complete default-feature source lane remains in macos-arm64.
    # Recovery gets its own unchanged 90-minute job budget after the observed
    # combined lane exhausted that budget following an 85-minute source pass.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify host and pinned Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show
      - name: Install native Opus build dependency
        run: |
          brew install opus pkgconf
          pkg-config --modversion opus
          test -f "$(brew --prefix opus)/lib/libopus.a"
      - name: Reserve diagnostic headroom and record host storage
        run: python3 scripts/ci-diagnostics.py prepare
      - name: Prepare pinned and TypeScript dependencies
        run: |
          bash scripts/prepare-dependencies.sh
          npm ci --prefix sdk/typescript
      - name: Compile Gate 3 contract fixtures without running tests
        # This independent job starts without the linked artifacts previously
        # inherited from source qualification. Keep cold compilation outside
        # the existing 600-second contract-fixture execution budget.
        timeout-minutes: 30
        run: cargo test --locked -p connect-server --test contract_fixtures --no-run
      - name: Gate 3 offline media and recovery lane (no provider accounts)
        run: python3 scripts/check-gate-3.py
      - name: Build public schema-6 recovery baseline
        run: python3 scripts/build-recovery-baseline.py --retire-build-cache
      - name: Qualify schema-6 upgrade and rollback from actual executables
        run: python3 scripts/check-schema-six.py --previous-binary .local/recovery-baselines/8bf5bd31a519a5fa84ef8f80e4da3b58374c6de5/connect
      - name: Verify generated TypeScript distribution
        run: git diff --exit-code -- sdk/typescript/dist
      - name: Retain actual phase and disk diagnostics
        if: always()
        run: python3 scripts/ci-diagnostics.py collect
      - name: Upload source-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-3-recovery-source-diagnostics-${{ github.run_attempt }}
          path: .local/ci-diagnostics/upload/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  gate-5-source:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native Opus build dependency
        run: |
          brew install opus pkgconf
          pkg-config --modversion opus
          test -f "$(brew --prefix opus)/lib/libopus.a"
      - name: Reserve diagnostic headroom and record host storage
        run: python3 scripts/ci-diagnostics.py prepare
      - name: Gate 5 source coverage without accounts or an installed model host
        # Explicit partial qualification. Full local offline runs also select
        # an installed Codex binary and execute the scripted host checks.
        run: python3 scripts/check-gate-5.py --source-only
      - name: Retain actual phase and disk diagnostics
        if: always()
        run: python3 scripts/ci-diagnostics.py collect
      - name: Upload source-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-5-source-diagnostics-${{ github.run_attempt }}
          path: .local/ci-diagnostics/upload/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  gate-5-independent-control:
    # Real Python/aioquic control interoperability, separate cold compilation.
    # This cannot claim installed/model/media or whole Gate5 acceptance.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify host and native dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install opus pkgconf
          test -f "$(brew --prefix opus)/lib/libopus.a"
      - name: Reserve diagnostic headroom and record host storage
        run: python3 scripts/ci-diagnostics.py prepare
      - name: Independent verified native QUIC control lane
        run: python3 scripts/check-gate-5.py --lane independent-client
      - name: Retain actual phase and disk diagnostics
        if: always()
        run: python3 scripts/ci-diagnostics.py collect
      - name: Upload source-only independent-control diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-5-independent-control-diagnostics-${{ github.run_attempt }}
          path: .local/ci-diagnostics/upload/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  gate-5-native-example:
    # Generated-source native example cleanup, separate cold compilation.
    # This does not acquire hardware or qualify installed/model/whole Gate5 acceptance.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify host and native dependencies
        run: |
          test "$(uname -m)" = arm64
          brew install opus pkgconf ffmpeg
          test -f "$(brew --prefix opus)/lib/libopus.a"
      - name: Reserve diagnostic headroom and record host storage
        run: python3 scripts/ci-diagnostics.py prepare
      - name: Generated native interruption and capture-refusal lifecycle
        run: python3 scripts/check-gate-5.py --lane native-example --ffmpeg-binary "$(brew --prefix ffmpeg)/bin/ffmpeg"
      - name: Retain actual phase and disk diagnostics
        if: always()
        run: python3 scripts/ci-diagnostics.py collect
      - name: Upload source-only native-example diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-5-native-example-diagnostics-${{ github.run_attempt }}
          path: .local/ci-diagnostics/upload/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
