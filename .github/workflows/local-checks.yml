name: Local source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify host and pinned Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show
      - name: Run source qualification (no accounts or live calls)
        run: python3 scripts/check-local.py --ci
      - name: Verify generated TypeScript distribution
        run: git diff --exit-code -- sdk/typescript/dist

      - name: Gate 3 offline media and recovery lane (no provider accounts)
        run: python3 scripts/check-gate-3.py
      - name: Build public schema-6 recovery baseline
        run: python3 scripts/build-recovery-baseline.py
      - name: Qualify schema-6 upgrade and rollback from actual executables
        run: python3 scripts/check-schema-six.py --previous-binary .local/recovery-baselines/8bf5bd31a519a5fa84ef8f80e4da3b58374c6de5/connect
      - name: Print Rust diagnostics after failure
        if: failure()
        run: |
          for log in .local/checks/*/lint.log; do
            if test -f "$log"; then tail -n 200 "$log"; fi
          done

  gate-4-source:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Gate 4 source coverage without accounts or an installed model host
        # Explicit partial qualification. Full local offline runs also select
        # an installed Codex binary and execute the scripted host checks.
        run: python3 scripts/check-gate-4.py --source-only
      - name: Print Rust diagnostics after failure
        if: failure()
        run: |
          for log in .local/gate-4-checks/*/lint.log; do
            if test -f "$log"; then tail -n 200 "$log"; fi
          done
