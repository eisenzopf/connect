name: Gate 6 transport matrix components
on:
  workflow_call:
    inputs:
      component:
        type: string
        default: control
      signing:
        type: string
        default: EdDSA
permissions:
  contents: read
concurrency:
  group: gate6-transport-matrix-${{ inputs.component }}-${{ inputs.signing }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  control:
    name: Ubuntu transport ${{ inputs.component }} component
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/gate6-linux-installation-target
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CC: clang
      CXX: clang++
      TRANSPORT_COMPONENT: ${{ inputs.component }}
      TRANSPORT_SIGNING: ${{ inputs.signing }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.component == 'control' || inputs.component == 'conversation' || inputs.component == 'data'
        with:
          node-version: '22'
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libopus-dev libssl-dev ffmpeg
      - name: Prepare private fixture capture
        if: inputs.component == 'data'
        run: |
          sudo apt-get install -y tcpdump libcap2-bin
          sudo setcap cap_net_raw=ep /usr/bin/tcpdump
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            .deps
            .local/gate6-linux-installation-target
            .local/gate6-linux-ci/source-times.json
          key: g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-
            g6-linux-installation-v1-
      - name: Prepare verified sources and locked dependencies
        run: |
          python3 scripts/lib/source_build_cache.py restore
          python3 scripts/lib/ci_dependency_cache.py
          cargo fetch --locked
      - name: Check matrix scope and promotion guards
        run: |
          python3 -c 'import os; assert os.environ["TRANSPORT_COMPONENT"] in {"control", "materializer", "actors", "conversation", "data"}'
          python3 -m unittest discover -s scripts/tests -p 'test_transport_*.py'
          python3 scripts/check-gate-6-transports.py --phase inventory
      - name: Validate selected signing cohort
        run: python3 -c 'import os; assert os.environ["TRANSPORT_SIGNING"] in {"EdDSA", "ES256"}'
      - name: Build current Node browser-SDK control inputs
        if: inputs.component == 'control' || inputs.component == 'conversation' || inputs.component == 'data'
        working-directory: sdk/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Run exact non-media QUIC HTTP3 and WSS control functions
        if: inputs.component == 'control'
        id: control
        run: python3 scripts/check-gate-6-transports.py --phase control
      - name: Rehearse production stopped-backup fixture materialization
        if: inputs.component == 'materializer' || inputs.component == 'actors' || inputs.component == 'conversation' || inputs.component == 'data'
        id: materializer
        run: python3 scripts/check-transport-fixtures.py ${{ inputs.component == 'data' && '--data-workload' || inputs.component == 'conversation' && '--conversation' || inputs.component == 'actors' && '--actors' || '' }} --signing-algorithm "$TRANSPORT_SIGNING"
      - name: Upload redacted component and unqualified matrix inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-transport-matrix-${{ inputs.component }}${{ inputs.signing == 'ES256' && '-ES256' || '' }}
          path: .local/gate6-transports/evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Preserve completed unchanged-source compilation
        id: preserve
        if: ${{ !cancelled() && (steps.control.outputs.cacheable_build == 'true' || steps.materializer.outputs.cacheable_build == 'true') && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,runpy,subprocess
          component=os.environ['TRANSPORT_COMPONENT']
          assert component in {'control','materializer','actors','conversation','data'}
          base=pathlib.Path('.local/gate6-transports/evidence')/component
          report=json.loads((base/('control.json' if component=='control' else 'rehearsal.json')).read_text())
          assert report['cacheable_build'] and report['source_inputs_unchanged'] and report['executables_unchanged']
          assert report['source_revision']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          raw=(base/'source-inputs.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==report['source_inputs_sha256']
          assert json.loads(raw)==runpy.run_path('scripts/check-gate6-linux-hosting.py')['sources']()
          subprocess.run(['python3','scripts/lib/source_build_cache.py','save'],check=True)
          PY
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.preserve.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            .deps
            .local/gate6-linux-installation-target
            .local/gate6-linux-ci/source-times.json
          key: g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-${{ github.sha }}
