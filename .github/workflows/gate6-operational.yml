name: Gate 6 operational visibility
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: gate6-operational-${{ github.ref }}
  cancel-in-progress: false
jobs:
  component:
    name: Operational ${{ matrix.phase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        phase: [schema, runtime]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/gate6-linux-installation-target
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native build prerequisites
        if: ${{ matrix.phase == 'runtime' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libopus-dev libssl-dev ffmpeg
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            .deps
            .local/gate6-linux-installation-target
            .local/gate6-linux-ci/source-times.json
          key: g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-
            g6-linux-installation-v1-
      - name: Prepare verified sources and locked dependencies
        run: |
          python3 scripts/lib/source_build_cache.py restore
          python3 scripts/lib/ci_dependency_cache.py
          cargo fetch --locked
      - name: Execute bounded operational component
        id: component
        env:
          COMPONENT_PHASE: ${{ matrix.phase }}
        run: python3 scripts/check-operational-visibility.py --phase "$COMPONENT_PHASE"
      - name: Upload curated component and generated reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-operational-${{ matrix.phase }}
          path: .local/gate6-operational/evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Preserve completed unchanged-source runtime compilation
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.component.outputs.cacheable_build == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/lib/source_build_cache.py save
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.component.outputs.cacheable_build == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            .deps
            .local/gate6-linux-installation-target
            .local/gate6-linux-ci/source-times.json
          key: g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-${{ github.sha }}
