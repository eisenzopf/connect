name: Gate 6 operational visibility
on:
  workflow_call:
    inputs:
      phase:
        type: string
        default: all
permissions:
  contents: read
concurrency:
  group: gate6-operational-${{ github.ref }}-${{ inputs.phase }}
  cancel-in-progress: false
jobs:
  component:
    name: Operational ${{ matrix.phase }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(inputs.phase == 'schema' && '["schema"]' || '["schema","runtime"]') }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/gate6-linux-installation-target
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install native build prerequisites
        if: ${{ matrix.phase == 'runtime' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libopus-dev libssl-dev ffmpeg
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            .deps
            .local/gate6-linux-installation-target
            .local/gate6-linux-ci/source-times.json
          key: g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-
            g6-linux-installation-v1-
      - name: Prepare verified sources and locked dependencies
        id: prepare
        run: |
          python3 scripts/lib/source_build_cache.py restore
          python3 scripts/lib/ci_dependency_cache.py
          cargo fetch --locked
      - name: Derive and verify protocol schema shape
        if: ${{ matrix.phase == 'schema' }}
        run: python3 scripts/check-operational-visibility.py --phase schema
      - name: Store administrator authority and configured numeric bounds
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.prepare.outcome == 'success' }}
        run: python3 scripts/check-operational-visibility.py --phase runtime --case store-authority
      - name: Service resource observers and current authorization
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.prepare.outcome == 'success' }}
        run: python3 scripts/check-operational-visibility.py --phase runtime --case service-observation
      - name: Actual admission permits and owner retirement
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.prepare.outcome == 'success' }}
        run: python3 scripts/check-operational-visibility.py --phase runtime --case permit-lifetime
      - name: Public health and real socket expiry overload and drain
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.prepare.outcome == 'success' }}
        run: python3 scripts/check-operational-visibility.py --phase runtime --case public-client
      - name: Public participant upload and subscription limits
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.prepare.outcome == 'success' }}
        run: python3 scripts/check-operational-visibility.py --phase runtime --case hosting-limits
      - name: Durable operation overload retains cancellation and causal recovery room
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.prepare.outcome == 'success' }}
        run: python3 scripts/check-operational-visibility.py --phase runtime --case operation-overload
      - name: Verify all component results share the unchanged source boundary
        id: component
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.prepare.outcome == 'success' }}
        run: python3 scripts/check-operational-visibility.py --phase runtime --aggregate
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ matrix.phase == 'runtime' && steps.component.outcome == 'success' }}
        with:
          node-version: '22'
      - name: Verify process observation ownership and privacy boundaries
        if: ${{ matrix.phase == 'runtime' && steps.prepare.outcome == 'success' }}
        run: python3 -m unittest discover -s scripts/tests -p test_operational_process_resources.py
      - name: Install locked owned browser runtime
        if: ${{ matrix.phase == 'runtime' && steps.component.outcome == 'success' }}
        working-directory: scripts/video/observer-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Measure actual production server SDK helper and owned browser separately
        if: ${{ matrix.phase == 'runtime' && steps.component.outcome == 'success' }}
        run: python3 scripts/check-operational-processes.py
      - name: Upload curated component and generated reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-operational-${{ matrix.phase }}
          path: .local/gate6-operational/evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Preserve completed unchanged-source runtime compilation
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.component.outputs.cacheable_build == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        run: python3 scripts/lib/source_build_cache.py save
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && matrix.phase == 'runtime' && steps.component.outputs.cacheable_build == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            .deps
            .local/gate6-linux-installation-target
            .local/gate6-linux-ci/source-times.json
          key: g6-linux-installation-v1-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-${{ github.sha }}
