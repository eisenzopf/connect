name: Gate 6 installed reference application
on:
  workflow_call:
    inputs:
      target:
        type: string
        default: all
permissions:
  contents: read
  actions: read
jobs:
  installed:
    name: Installed application ${{ matrix.target }} Node22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.target == 'macos' && '{"include":[{"os":"macos-15","target":"aarch64-apple-darwin"}]}' || '{"include":[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-15","target":"aarch64-apple-darwin"}]}') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check application intent recovery and setup boundaries
        run: npm run test:app --prefix examples/parley-on-connect
      - name: Install documented Ubuntu runtime prerequisites
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus0 libssl3t64 ffmpeg
      - name: Install exact verified production candidate in a cold ordinary consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/install-reference-app-candidate.py --target '${{ matrix.target }}' --output .local/gate6-reference-app/candidate
      - name: Install pinned owned browser tools
        working-directory: scripts/video/observer-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Rehearse actual one-command setup keyboard text invitations offline recovery and original shutdown
        run: node scripts/check-reference-app-installed.mjs .local/gate6-reference-app/candidate .local/gate6-reference-app/browser
      - name: Retain curated component evidence only
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          base=pathlib.Path('.local/gate6-reference-app')
          out=base/'evidence';out.mkdir(parents=True,exist_ok=True)
          for name,source in [('installation.json',base/'candidate/installation.json'),('browser.json',base/'browser/summary.json')]:
              if not source.exists():continue
              value=json.loads(source.read_text())
              for key in ('consumer','executable'):value.pop(key,None)
              (out/name).write_text(json.dumps(value,indent=2)+'\n')
          PY
      - name: Upload curated installation and browser reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-reference-app-${{ matrix.target }}
          path: .local/gate6-reference-app/evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
