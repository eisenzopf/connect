name: Gate 6 native server and helper assets
on:
  workflow_call:
    inputs:
      qualification:
        type: boolean
        default: false
      reference_app:
        type: boolean
        default: false
      app_cpu_profile:
        type: boolean
        default: false
      native_server_sample:
        type: boolean
        default: false
      app_clock_trace:
        type: boolean
        default: false
      app_native_audio_trace:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  runtime:
    name: Native ${{ matrix.target }} assets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # Standard macos-15 is arm64; the producer verifies the actual host
          # and executable rather than inferring architecture from this label.
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/gate6-linux-installation-target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CC: clang
      CXX: clang++
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux native build prerequisites
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libopus-dev libssl-dev
      - name: Ensure macOS build tools are available
        if: ${{ runner.os == 'macOS' }}
        run: |
          command -v clang
          command -v cmake || brew install cmake
          command -v pkg-config || brew install pkgconf
          # All earlier test builds sharing this target must select the same
          # native codec as the production producer, including on cache hits.
          cat >> "$GITHUB_ENV" <<'ENV'
          MACOSX_DEPLOYMENT_TARGET=15.0
          OPUS_STATIC=1
          LIBOPUS_NO_PKG=1
          CMAKE_POLICY_VERSION_MINIMUM=3.5
          ENV
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            ~/.cargo/registry
            .deps
            .local/gate6-linux-installation-target
            .local/gate6-linux-ci/source-times.json
          key: g6-sdk-runtime-${{ runner.os == 'macOS' && 'bundled-opus-v2' || 'v1' }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            g6-sdk-runtime-${{ runner.os == 'macOS' && 'bundled-opus-v2' || 'v1' }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-
            ${{ runner.os == 'Linux' && 'g6-linux-installation-v1-' || 'g6-macos-sdk-runtime-unused-' }}
      - name: Prepare original locked sources
        run: |
          python3 scripts/lib/source_build_cache.py restore
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/lib/ci_dependency_cache.py
          else
            bash scripts/prepare-dependencies.sh
          fi
          cargo fetch --locked
      - name: Check fresh Session metadata snapshots and current lifecycle guards
        if: ${{ inputs.reference_app }}
        run: |
          cargo test --release --locked -p connect-store --test session_metadata_polling -- --nocapture
          cargo test --release --locked -p connect-store --lib session_observation -- --nocapture
          cargo test --release --locked -p connect-store --lib peer_authority::connection_media::snapshot::tests -- --nocapture
          cargo test --release --locked -p connect-store --lib transitions::tests::peer_operations -- --nocapture
          cargo test --release --locked -p connect-store --lib native_stream_authority::data_reads -- --nocapture
          cargo test --release --locked -p connect-store --lib native_stream_authority::flow_facts -- --test-threads=2
      - name: Check native build provenance and archive installation boundaries
        run: |
          python3 -m unittest discover -s scripts/tests -p test_sdk_runtime_build.py -v
          python3 -m unittest discover -s scripts/tests -p test_sdk_candidate.py -v
      - name: Build and package production platform assets
        id: package
        run: python3 scripts/package-sdk-runtime.py --target ${{ matrix.target }} --output dist/sdk/runtime --evidence .local/gate6-runtime-candidate/evidence/${{ matrix.target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ inputs.qualification || inputs.reference_app }}
        with:
          node-version: '22'
      - name: Prepare locked Node SDK package builder
        if: ${{ inputs.qualification || inputs.reference_app }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix sdk/typescript
          npm run build --prefix sdk/typescript
          git diff --exit-code -- sdk/typescript/dist
      - name: Prepare locked Python SDK package builder
        if: ${{ inputs.qualification }}
        run: python3 -m pip install --disable-pip-version-check --no-deps --require-hashes -r sdk/python/build-requirements.txt
      - name: Check live receive result expiration and reliable-data recovery
        if: ${{ inputs.qualification || inputs.reference_app }}
        run: |
          node --test sdk/tests/node_media.test.mjs
          node --test sdk/tests/node_raw.test.mjs
          python3 -m unittest discover -s sdk/tests -p test_python_media.py -v
          python3 -m unittest discover -s sdk/tests -p test_python_data.py -v
      - name: Check native archive extraction boundaries
        if: ${{ inputs.qualification }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_sdk_candidate.py -v
          python3 -m unittest discover -s scripts/tests -p test_sdk_sealed_candidate.py -v
      - name: Assemble and check external pure SDK archive installations
        if: ${{ inputs.qualification }}
        run: |
          python3 sdk/tests/check_node_installation.py --output .local/gate6-runtime-candidate/components/node
          python3 sdk/tests/check_python_installation.py --output .local/gate6-runtime-candidate/components/python
          python3 scripts/package-sdk-rust.py --output dist/sdk/rust/candidate
      - name: Run actual installed SDK examples and join their original native owners
        if: ${{ inputs.qualification }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          base=pathlib.Path('.local/gate6-runtime-candidate')
          evidence=base/'evidence/${{ matrix.target }}'
          runtime=json.loads((evidence/'runtime.json').read_text())
          subprocess.run(['python3','scripts/check-sdk-native-installation.py',
              '--runtime',str(pathlib.Path('dist/sdk/runtime')/runtime['archive_name']),
              '--runtime-proof',str(evidence/'runtime.json'),
              '--node-proof',str(base/'components/node/summary.json'),
              '--python-proof',str(base/'components/python/summary.json'),
              '--rust-source','dist/sdk/rust/candidate',
              '--output',str(evidence/'installed')],check=True)
          PY
      - name: Rebuild SDK sources from pinned archives with cold offline caches
        if: ${{ inputs.qualification }}
        run: python3 scripts/package-sdk-offline.py --output dist/sdk/offline --evidence .local/gate6-runtime-candidate/evidence/${{ matrix.target }}/offline --wheel-proof .local/gate6-runtime-candidate/components/python/summary.json
      - name: Assemble matching versioned packages source examples and publication manifests
        if: ${{ inputs.qualification }}
        run: |
          python3 scripts/assemble-sdk-candidate.py \
            --runtime-proof .local/gate6-runtime-candidate/evidence/${{ matrix.target }}/runtime.json \
            --node-proof .local/gate6-runtime-candidate/components/node/summary.json \
            --python-proof .local/gate6-runtime-candidate/components/python/summary.json \
            --rust-source dist/sdk/rust/candidate \
            --installed-proof .local/gate6-runtime-candidate/evidence/${{ matrix.target }}/installed/summary.json \
            --offline-proof .local/gate6-runtime-candidate/evidence/${{ matrix.target }}/offline/summary.json \
            --offline-inputs dist/sdk/offline --output dist/sdk/candidate \
            --evidence .local/gate6-runtime-candidate/evidence/${{ matrix.target }}/assembled
      - name: Check app recovery and component installation boundaries
        if: ${{ inputs.reference_app }}
        run: |
          npm run test:app --prefix examples/parley-on-connect
          node --test scripts/tests/app_cpu_summary.test.mjs
          node --test scripts/tests/native_server_sample.test.mjs
          node --test scripts/tests/app_media_clock_trace.test.mjs
          node --test scripts/tests/app_native_audio_trace.test.mjs
          python3 -m unittest discover -s scripts/tests -p test_reference_app_components.py -v
      - name: Package public Node SDK for the component app rehearsal
        if: ${{ inputs.reference_app && !inputs.qualification }}
        run: python3 sdk/tests/check_node_installation.py --output .local/gate6-runtime-candidate/components/node
      - name: Install current source-matched runtime and Node components offline
        if: ${{ inputs.reference_app }}
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          base=pathlib.Path('.local/gate6-runtime-candidate')
          native=base/'evidence/${{ matrix.target }}/runtime.json'
          node=base/'components/node/summary.json'
          runtime=json.loads(native.read_text());package=json.loads(node.read_text())
          subprocess.run(['python3','scripts/install-reference-app-components.py',
              '--runtime',str(pathlib.Path('dist/sdk/runtime')/runtime['archive_name']),
              '--runtime-proof',str(native),
              '--node',str(pathlib.Path('dist/sdk/typescript/node')/package['archive_name']),
              '--node-proof',str(node),'--output','.local/gate6-reference-app/candidate'],check=True)
          PY
      - name: Install Ubuntu app codec prerequisite
        if: ${{ inputs.reference_app && runner.os == 'Linux' }}
        run: sudo apt-get install -y ffmpeg
      - name: Ensure macOS app codec prerequisite
        if: ${{ inputs.reference_app && runner.os == 'macOS' }}
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install pinned owned full Chromium for app rehearsal
        if: ${{ inputs.reference_app }}
        working-directory: scripts/video/observer-tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Select the exact frozen macOS full browser
        if: ${{ inputs.reference_app && runner.os == 'macOS' }}
        run: |
          python3 - <<'BROWSER'
          from pathlib import Path
          import hashlib,json,os,subprocess
          root=Path.cwd();base=root/'.local/gate6-reference-app/frozen-chrome'
          base.mkdir(parents=True,exist_ok=False)
          version=json.loads((root/'contracts/gate6-transport-matrix.json').read_text())['expected_browsers_by_client_platform']['macos-arm64']['chrome']
          assert version=='156.0.8078.48'
          archive=base/'chrome-mac-arm64.zip'
          url='https://storage.googleapis.com/chrome-for-testing-public/'+version+'/mac-arm64/chrome-mac-arm64.zip'
          subprocess.run(['curl','--fail','--location','--proto','=https','--max-time','180','--output',str(archive),url],check=True,timeout=185)
          with archive.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
          assert archive.stat().st_size==194924436
          assert digest=='fdd24b0cb5c2841c9b21d4fff3b66f0f255e25b5c4109af68516e01f11c8de6c'
          subprocess.run(['ditto','-x','-k',str(archive),str(base/'extracted')],check=True,timeout=90)
          executable=base/'extracted/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing'
          assert subprocess.check_output([str(executable),'--version'],text=True,timeout=20).strip()=='Google Chrome for Testing '+version
          with Path(os.environ['GITHUB_ENV']).open('a') as stream: stream.write('CONNECT_GATE6_CHROME='+str(executable)+'\n')
          BROWSER
      - name: Rehearse all current installed app checks with original owners
        if: ${{ inputs.reference_app }}
        run: node scripts/check-reference-app-installed.mjs .local/gate6-reference-app/candidate .local/gate6-reference-app/browser ${{ inputs.app_cpu_profile && '--profile-app-cpu' || '' }} ${{ inputs.native_server_sample && runner.os == 'macOS' && '--sample-native-server' || '' }} ${{ inputs.app_clock_trace && '--trace-media-clock' || '' }} ${{ inputs.app_native_audio_trace && '--trace-native-audio' || '' }}
      - name: Retain app component proof and synthetic browser evidence
        if: ${{ always() && inputs.reference_app }}
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          base=pathlib.Path('.local/gate6-reference-app')
          out=base/'evidence';out.mkdir(parents=True,exist_ok=True)
          for name,source in [('installation.json',base/'candidate/installation.json'),('browser.json',base/'browser/summary.json')]:
              if not source.is_file():continue
              value=json.loads(source.read_text())
              for key in ('consumer','executable'):value.pop(key,None)
              (out/name).write_text(json.dumps(value,indent=2)+'\n')
          node=pathlib.Path('.local/gate6-runtime-candidate/components/node')
          for name,source in [('node-producer.json',node/'summary.json'),('node-source-inputs.json',node/'source-inputs.json')]:
              if source.is_file():shutil.copyfile(source,out/name)
          for name in ['native-controls.png','native-controls-narrow.png','capture-controls.png','capture-controls-narrow.png','video-controls.png','video-controls-narrow.png']:
              source=base/'browser'/name
              if source.is_file():shutil.copyfile(source,out/name)
          PY
      - name: Upload curated current component app results
        if: ${{ always() && inputs.reference_app }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-reference-app-components-${{ matrix.target }}
          path: .local/gate6-reference-app/evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Upload unpublished Node component archives
        if: ${{ always() && inputs.reference_app }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-reference-app-node-package-${{ matrix.target }}
          path: dist/sdk/typescript/node/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn
      - name: Upload curated build and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-runtime-candidate-evidence-${{ matrix.target }}
          path: |
            .local/gate6-runtime-candidate/evidence/
            !.local/gate6-runtime-candidate/evidence/**/private/**
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Upload unpublished production platform assets
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-runtime-candidate-package-${{ matrix.target }}
          path: dist/sdk/runtime/*.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload complete unpublished SDK candidate
        if: ${{ inputs.qualification }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate6-complete-sdk-candidate-${{ matrix.target }}
          path: dist/sdk/candidate/*.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve completed source-verified compilation
        if: ${{ !cancelled() && steps.package.outputs.cacheable_build == 'true' }}
        run: python3 scripts/lib/source_build_cache.py save
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.package.outputs.cacheable_build == 'true' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            .deps
            .local/gate6-linux-installation-target
            .local/gate6-linux-ci/source-times.json
          key: g6-sdk-runtime-${{ runner.os == 'macOS' && 'bundled-opus-v2' || 'v1' }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'dependencies/source-lock.json', 'rust-toolchain.toml') }}-${{ github.sha }}
